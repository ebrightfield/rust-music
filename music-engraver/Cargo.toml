[package]
name = "music-engraver"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Native Rust SVG music engraver consuming music crate types"

[dependencies]
music = { path = "../music" }
ttf-parser = "0.25"
smufl = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]

[features]
default = []
png = ["dep:resvg", "dep:tiny-skia", "dep:fontdb"]

[dependencies.resvg]
version = "0.44"
optional = true

[dependencies.tiny-skia]
version = "0.11"
optional = true

[dependencies.fontdb]
version = "0.22"
optional = true
