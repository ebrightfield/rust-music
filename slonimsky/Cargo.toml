[package]
name = "slonimsky"
version = "0.1.0"
edition = "2021"
description = "Music-theory CLI: analysis, combinatorics, practice-material generation"

[dependencies]
music = { path = "../music" }
musical-combinatorics = { path = "../musical-combinatorics" }
music-midi = { path = "../music-midi", optional = true }
midly = { version = "0.5", optional = true }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rand = { version = "0.8", optional = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
serde_json = "1"

[features]
default = []
lilypond = ["music/lilypond"]
midi = ["dep:music-midi", "dep:midly", "dep:rand"]
