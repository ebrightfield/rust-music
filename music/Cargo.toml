[package]
name = "music"
version = "0.1.0"
edition = "2021"

[lib]

[[example]]
name = "pitch_set_svgs"

[[example]]
name = "primitives"

[[example]]
name = "collections"

[[example]]
name = "generate_lilypond"
required-features = ["lilypond"]

[features]
default = []
serde = ["dep:serde"]
lilypond = ["dep:tera", "dep:serde"]

[dev-dependencies]
trybuild = "1"
serde_json = "1"

[dependencies]
itertools = "0.10.5"
once_cell = "1.16.0"
tera = { version = "1.17.1", optional = true}
serde = { version = "1.0.181", features = ["derive"], optional = true }
thiserror = "1.0.37"
