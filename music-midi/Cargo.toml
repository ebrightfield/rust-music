[package]
name         = "music-midi"
version      = "0.1.0"
edition      = "2021"
rust-version = "1.75"
license      = "MIT OR Apache-2.0"
description  = "Convert `music` crate types to MIDI (SMF / realtime / audio)."

[features]
# [AMEND-A] `score` enables LilypondScore conversion. `smf` implies `score` because
# `score_to_smf_bytes` consumes flattened-score events. Builds with neither `score`
# nor `smf` skip the lilypond-feature chain entirely (`tera`, `serde`).
default  = ["smf"]
score    = ["music/lilypond"]
smf      = ["dep:midly", "score"]
playback = ["dep:midir"]
render   = ["dep:oxisynth", "dep:hound", "dep:ureq", "dep:dirs", "dep:sha2"]
full     = ["smf", "playback", "render"]

[dependencies]
# [AMEND-A] No default features here; the `score` feature on `music-midi` forwards
# `music/lilypond`. Other modules of `music` we depend on (note, fretboard, melody,
# rhythm) are NOT behind a feature gate.
music     = { path = "../music", default-features = false }
thiserror = "1.0.37"
itertools = "0.10.5"

midly     = { version = "0.5",  optional = true }
midir     = { version = "0.10", optional = true }
oxisynth  = { version = "0.0.5", optional = true }
hound     = { version = "3.5",  optional = true }
ureq      = { version = "2.9",  optional = true, default-features = false, features = ["tls"] }
dirs      = { version = "5",    optional = true }
sha2      = { version = "0.10", optional = true }

[dev-dependencies]
tempfile = "3"
